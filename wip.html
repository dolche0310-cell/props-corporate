<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MiAI — Work in progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* グロナビの遷移先。まだデザインが無いセクションの受け皿。
     文字組みと動きは参考ページ(proto-review-vict0a.pages.dev/c-wip)に
     合わせ、色と地だけ MiAI の値(白地 / #6D6D6D / #191919)に置き換える。
     ヘッダーもフッターも持たない素のページ。 */
  * { box-sizing: border-box; margin: 0; }
  :root {
    --paper: #FFFFFF;
    --ink: #191919;
    --ink-2: #6D6D6D;
    --ease-out-expo: cubic-bezier(.16, 1, .3, 1);
  }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wip {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: -24px;
  }
  .wip-label {
    font-weight: 500;
    font-size: 11px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--ink-2);
    opacity: 0;
    animation: wipRise .9s var(--ease-out-expo) .05s both;
  }
  .wip-back {
    margin-top: 34px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    padding: 2px 0;
    position: relative;
    opacity: 0;
    animation: wipRise .9s var(--ease-out-expo) .16s both;
  }
  .wip-back::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 100%;
    height: 1px;
    background: currentColor;
    opacity: .35;
    transition: opacity .45s var(--ease-out-expo);
  }
  @media (hover: hover) {
    .wip-back:hover::after { opacity: .9; }
  }
  .wip-back svg { display: block; }
  @keyframes wipRise { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .wip-label, .wip-back { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <main class="wip">
    <p class="wip-label">Work in progress</p>
    <a class="wip-back" id="wip-back" href="Red-orange.html">
      <svg viewBox="0 0 14 12" width="11" height="9" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M13.2 6H2M6 1.4L1.4 6L6 10.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to top
    </a>
  </main>
<script>
  /* 戻り先は ?d= の合図だけで決める。URL の文字列をそのまま href に
     入れると任意の行き先を仕込めてしまうため、既知の2案だけを引き当てる。 */
  (function () {
    var PAGES = { a1: 'Red-orange.html', a2: 'darkblack.html' };
    var d = new URLSearchParams(location.search).get('d');
    var back = document.getElementById('wip-back');
    if (back && PAGES[d]) back.setAttribute('href', PAGES[d]);
  })();
</script>
</body>
</html>
