<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MiAI ウェブサイト制作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Lato:wght@400;700&display=swap">
<style>
:root{
  --ink:#0d0d0e; --paper:#f5f5f7; --card:#fff;
  --caption:#606070; --line:rgba(13,13,14,.12);
  --accent:#0d0d0e;            /* キーカラーが決まったらここだけ差し替える */
  --font-ja:"Noto Sans JP",-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  --font-en:"Lato",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ja);
  font-size:14px;line-height:1.9;letter-spacing:.04em;padding:56px 24px 80px}
.in{max-width:760px;margin:0 auto}
.eyebrow{font-family:var(--font-en);font-weight:700;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--caption);margin:0}
h1{font-weight:700;font-size:26px;letter-spacing:.06em;line-height:1.5;margin:6px 0 0}
.lead{color:#3a3a40;margin:14px 0 0}
h2{font-weight:600;font-size:15px;letter-spacing:.1em;margin:48px 0 0}
ul{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
li a{display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:var(--card);border-radius:10px;padding:16px 18px;text-decoration:none;color:inherit;
  box-shadow:0 1px 2px rgba(13,13,14,.04),0 6px 16px rgba(13,13,14,.045)}
li a .t{font-weight:600}
li a .s{font-size:12px;color:var(--caption)}
.empty{background:var(--card);border-radius:10px;padding:20px;margin-top:16px;color:var(--caption)}
.note{margin-top:14px;font-size:12px;color:var(--caption)}
code{font-family:var(--font-en);background:rgba(13,13,14,.06);border-radius:4px;padding:1px 6px}
</style>
</head>
<body>
<div class="in">
  <p class="eyebrow">MiAI</p>
  <h1>ウェブサイト制作</h1>
  <p class="lead">制作中のページの一覧です。ページを追加したら、このファイルにリンクを1行足します。</p>

  <h2>ページ</h2>
  <ul>
    <li><a href="internal-lp.html"><span class="t">MiAI面談（社内用LP）</span><span class="s">internal-lp.html</span></a></li>
  </ul>

  <h2>確認用</h2>
  <ul>
    <li><a href="sp-preview.html"><span class="t">スマホ版プレビュー</span><span class="s">sp-preview.html</span></a></li>
  </ul>
  <p class="note">スマホ版は <code>sp-preview.html?p=ページ名.html</code> のように、見たいページを指定して開きます。</p>
</div>
</body>
</html>
