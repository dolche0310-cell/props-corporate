<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>LOGOMARK &amp; LOGOTYPE — Design A</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/logo-detail.css?v=20260817m" />
</head>
<body>
  <div class="wrap">
    <h1 class="ld-title">LOGOMARK &amp; LOGOTYPE <span class="ld-title-sep">DESIGN A</span></h1>
    <div class="ld-cards">
      <section class="ld-card ld-card--lockup">
        <div class="ld-lockup" style="--lockup-gap: 0.253; --word-scale: 0.981;">
          <img class="ld-lockup-mark" src="assets/logos/mark-a.svg" alt="" aria-hidden="true" />
          <img class="ld-lockup-word" src="assets/logos/logotype-a.svg" alt="MiAI ロゴマーク・ロゴタイプ(Design A)" />
        </div>
      </section>
      <section class="ld-card ld-card--guide-v2">
        <!-- 斜めガイド(data-angle)は props のマークが傾いていないため付けない -->
        <div
          class="lg2-mount"
          data-mark-src="assets/logos/mark-a.svg"
          data-word-src="assets/logos/logotype-a.svg"
          data-gap-ratio="0.253" data-word-scale="0.981"
          data-mark-label="1.00X" data-word-label="2.68X"
          data-min-print-label="8mm" data-min-digital-label="24px"
        ></div>
      </section>
    </div>
  </div>
  <script src="js/logo-guide-v2.js?v=20260817m"></script>
</body>
</html>
