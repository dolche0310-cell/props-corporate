<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>CORPORATE LOGOMARK — Design Patterns</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@500;600&display=swap" rel="stylesheet" />
<style>
  /* 参考(proto-review-vict0a/logomark-patterns.html)の実測値に合わせた
     単独ページ。モーダルではない。
     ・上のカード: 10案を 5 列 x 2 行で並べる(枠線も押下も持たない)
     ・下のカード: ロゴマーク & ロゴタイプのセット
     ・右下の Spotlight: 全画面でセットを1案ずつ送って見る
     案は未確定なので、いま中身があるのは 01(DESIGN A)だけ。
     残りは空欄のまま。MARKS に足せばそのまま枠が埋まる。 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #111112;
    --ink-2: #6b6b70;
    --pane: #fafafa;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }
  body {
    background: #ffffff;
    font-family: "Noto Sans JP", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; max-width: 100%; }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    /* 上の余白は戻るリンクのぶんだけ詰め、見出しの位置は変えない
       (リンクの下マージンで元の位置に戻している) */
    padding: 44px 32px 250px;
  }
  .lm-title {
    font-family: "Inter", "Noto Sans JP", sans-serif;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 0.03em;
    line-height: 1.2;
    margin-bottom: 96px;
  }

  .lm-card {
    background: var(--pane);
    border-radius: 12px;
  }
  /* Figma 494:23602。5案を1列(1行)に並べる。列は 90px 固定で余りを均等に
     割ると間隔 80.5px になり、Figma の送り幅 170px(=スロット90+間隔80)と
     一致する。カードの高さは padding 104 x2 + スロット67 = 275px で
     Figma のカード高と同値。 */
  .lm-card--grid { padding: 104px 122px; }
  .lm-grid {
    display: grid;
    grid-template-columns: repeat(5, 90px);
    justify-content: space-between;
  }
  .lm-item {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 67px;
  }
  /* マークの寸法は Figma 494:23602 のフレーム実測をそのまま渡す。
     4案とも図形が viewBox いっぱい(比率1.00)なので、高さがそのまま
     見た目の大きさになる。90pxのスロット内で中央に置く。 */
  /* flex:none がないと、狭い幅で横だけ潰れて縦横比が崩れる。
     4案とも図形が正方(比率1.00)なので、幅で指定しておけば
     狭い画面では列幅に追従させるだけで比率が保てる。 */
  .lm-item img { flex: none; width: var(--mk, 67px); height: auto; }

  /* ロゴマーク & ロゴタイプのセット。
     組み方は logo-a.html の上段カード(.ld-card--lockup)と同一にする。
     マークの高さを 1X とし、ワードマークの高さと間隔は Figma 実測の
     比率(DESIGN A = 間隔 0.253X / ワード 0.981X)で決める。 */
  .lm-card--set {
    margin-top: 28px;
    height: 227px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lm-lockup {
    --lockup-mark: 72px;
    --lockup-gap: 0.253;
    --word-scale: 0.981;
    display: flex;
    align-items: center;
  }
  /* マークの枠は正方で固定する。枠を固定しているので、案を切り替えても
     ロゴタイプの位置とサイズは 1px も動かない。 */
  .lm-lockup-mark {
    position: relative;
    flex: none;
    width: var(--lockup-mark);
    height: var(--lockup-mark);
  }

  /* --- 案の切り替え(参考実装 css/logomark.css と同値) ---
     枠にぴったり重ねた2枚の濃さだけを入れ替える。裏の1枚に次の案を
     入れてから表に出すので、表示中の絵は一度も消えず位置も動かない。
     見比べる場面なので速く済ませずに一拍置く。伸ばしたぶん動きが
     見えないと止まって見えるので、寄りは 0.95→1 と少し大きめに取る。 */
  .mark-stack > img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    /* 待機はわずかに小さい。ここから実寸へ寄りながら現れる */
    opacity: 0;
    transform: scale(0.95);
    transition:
      opacity 0.56s cubic-bezier(0.4, 0, 0.35, 1) 0.3s,
      transform 0.95s cubic-bezier(0.16, 1, 0.3, 1) 0.3s;
    will-change: opacity, transform;
  }
  .mark-stack > img.is-front {
    opacity: 1;
    transform: scale(1);
  }
  /* 退場は動かさず、濃さだけを引く(動かすと去り際が騒がしくなる) */
  .mark-stack > img.is-out {
    opacity: 0;
    transform: scale(1);
    transition:
      opacity 0.3s cubic-bezier(0.4, 0, 0.6, 1) 0s,
      transform 0s 0.3s;
  }
  .lm-lockup-word {
    display: flex;
    align-items: center;
    margin-left: calc(var(--lockup-mark) * var(--lockup-gap));
  }
  .lm-lockup-word img {
    height: calc(var(--lockup-mark) * var(--word-scale));
    width: auto;
  }

  .lm-foot {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
  }
  .lm-jump {
    appearance: none;
    background: none;
    border: 0;
    padding: 2px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 15px;
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink);
    transition: opacity 0.3s ease;
  }
  .lm-jump:hover { opacity: 0.55; }
  /* 矢印は文言・番号のあと gap(15px)ぶんだけ空けて置く(参考実装と同値) */
  .lm-jump .arrow { display: inline-flex; }
  .lm-jump .arrow svg { display: block; width: 11px; height: 11px; }

  /* --- Spotlight: 全画面で1案ずつ --- */
  /* --- Spotlight ---
     開閉の仕組み・間合い・台の見え方は参考実装
     (proto-review-vict0a.pages.dev/logomark-patterns の css/logomark.css)に
     合わせる。閉じる操作は「中身の外側クリック」と ESC だけで、
     ばつボタンは置かない。 */
  .lm-spot {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    /* ここは「閉じるときの間合い」。滑らかなS字でゆっくり引く */
    transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .lm-spot[hidden] { display: none; }
  .lm-spot.is-open {
    opacity: 1;
    transition: opacity 0.34s var(--ease-out-expo);
  }
  /* 中身は白幕と別に動かす。同じ速さで薄れさせると、消えかけの大きな
     ロゴが裏の一覧に重なって残像になる。閉じるときは中身を先に(0.22s)
     引かせ、白幕だけをゆっくり溶かす。開くときは逆に白幕が先。 */
  .lm-spot-inner {
    width: min(1100px, 86vw);
    opacity: 0;
    transform: translateY(12px);
    transition:
      opacity 0.22s cubic-bezier(0.4, 0, 1, 1),
      transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .lm-spot.is-open .lm-spot-inner {
    opacity: 1;
    transform: none;
    transition:
      opacity 0.4s var(--ease-out-expo) 0.1s,
      transform 0.6s var(--ease-out-expo) 0.06s;
  }
  /* Spotlight は一回り大きく見せる。比率は同じ */
  .lm-spot-stage .lm-lockup { --lockup-mark: 96px; }
  .lm-spot-stage {
    display: flex;
    align-items: center;
    justify-content: center;
    /* 高さは固定せず、上下の余白で展示空間を作る */
    padding: clamp(64px, 13vh, 120px) 0;
    /* 白幕の上に置くので、ページ内カードの #fafafa だと灰色がはっきり
       出る。うっすら面があるとわかる程度まで上げる */
    background: #fcfcfc;
    /* 拡大表示の台は角を落とさず直角に */
    border-radius: 0;
  }
  /* 送りボタンは台の縁まで振り切らず、台幅の 8% だけ内側に置く */
  .lm-spot-foot {
    width: 100%;
    padding-right: 8%;
    margin-top: 20px;
    display: flex;
    justify-content: flex-end;
  }
  /* 文言と番号は続けて読ませるので、間は gap ではなく1文字分だけ */
  .lm-num {
    margin-left: -11px;
    font-variant-numeric: tabular-nums;
  }

  .lm-back {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 123px;
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-2);
    text-decoration: none;
    transition: color 0.3s ease;
  }
  .lm-back:hover { color: var(--ink); }
  .lm-back svg { width: 13px; height: 11px; }

  @media (max-width: 860px) {
    .wrap { padding: 88px 24px 120px; }
    .lm-title { font-size: 22px; margin-bottom: 56px; }
    .lm-back { margin-bottom: 56px; }
    .lm-card--grid { padding: 56px 32px; }
    .lm-grid { grid-template-columns: repeat(5, 1fr); }
    /* 狭い画面ではマークを列幅に収める(はみ出させない) */
    .lm-item { height: auto; }
    .lm-item img { width: 100%; }
    .lm-lockup { --lockup-mark: 52px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lm-spot, .lm-spot-inner, .lm-jump, .lm-back { transition: none; transform: none; }
    .mark-stack > img { transition: none; transform: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="lm-back" href="index.html">
      <svg viewBox="0 0 14 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13.2 6H2M6 1.4L1.4 6L6 10.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back
    </a>
    <h1 class="lm-title">CORPORATE LOGOMARK</h1>

    <!-- 10案。中身が決まるまでは空欄のまま並ぶ -->
    <div class="lm-card lm-card--grid">
      <div class="lm-grid" id="lm-grid"></div>
    </div>

    <!-- 比較ビュー: ロゴタイプは固定で、左のマークだけが案ごとに替わる -->
    <div class="lm-card lm-card--set">
      <div class="lm-lockup">
        <div class="lm-lockup-mark mark-stack" id="lm-mark" role="img" aria-label="ロゴマーク案01">
          <img alt="" /><img alt="" />
        </div>
        <div class="lm-lockup-word" id="lm-word"></div>
      </div>
    </div>

    <div class="lm-foot">
      <button class="lm-jump" type="button" id="lm-spotlight">Spotlight</button>
    </div>
  </div>

  <!-- Spotlight: 全画面でセットを1案ずつ送って見る -->
  <div class="lm-spot" id="lm-spot" role="dialog" aria-modal="true" aria-label="ロゴマーク Spotlight" hidden>
    <div class="lm-spot-inner">
      <div class="lm-card lm-spot-stage">
        <div class="lm-lockup">
          <div class="lm-lockup-mark mark-stack" id="lm-spot-mark" role="img" aria-label="ロゴマーク案01">
            <img alt="" /><img alt="" />
          </div>
          <div class="lm-lockup-word" id="lm-spot-word"></div>
        </div>
      </div>
      <div class="lm-spot-foot">
        <button class="lm-jump" type="button" id="lm-next">
View next logomark <span class="lm-num" id="lm-count">01 / 05</span><span class="arrow" aria-hidden="true"><svg viewBox="0 0 14 12" width="11" height="11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.8 6h11.2M8 1.4l4.6 4.6-4.6 4.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
      </div>
    </div>
  </div>

<script>
  (() => {
    "use strict";
    const COUNT = 5;
    /* Figma 494:23602 の並び順そのまま(1番と2番は同じ logo_1)。
       size は同ノードのフレーム実測(px)。4案とも図形が viewBox いっぱい
       なので、この高さがそのまま見た目の大きさになる。 */
    const MARKS = {
      1: { src: "assets/logos/mark-a.svg",           size: 66 },
      2: { src: "assets/logos/logomark-knot.svg",    size: 67 },
      3: { src: "assets/logos/logomark-square.svg",  size: 67 },
      4: { src: "assets/logos/logomark-connect.svg", size: 67 },
      5: { src: "assets/logos/logomark-round.svg",   size: 62 }
    };
    /* ロゴタイプ(DESIGN A) */
    const WORD = "assets/logos/logotype-a.svg";

    const pad = (n) => String(n).padStart(2, "0");
    const art = (m) => {
      const i = document.createElement("img");
      i.src = typeof m === "string" ? m : m.src;
      i.alt = "";
      if (m && m.size) i.style.setProperty("--mk", m.size + "px");
      return i;
    };

    const grid = document.getElementById("lm-grid");
    for (let i = 1; i <= COUNT; i++) {
      const cell = document.createElement("div");
      cell.className = "lm-item";
      cell.setAttribute("role", "img");
      cell.setAttribute("aria-label", "ロゴマーク案" + pad(i));
      if (MARKS[i]) cell.appendChild(art(MARKS[i]));
      grid.appendChild(cell);
    }

    const fillWord = (el) => {
      el.textContent = "";
      if (!WORD) return;
      const i = art(WORD);
      i.alt = "MiAI ロゴタイプ";
      el.appendChild(i);
    };

    fillWord(document.getElementById("lm-word"));
    fillWord(document.getElementById("lm-spot-word"));

    /* --- Spotlight --- */
    const spot = document.getElementById("lm-spot");
    const countEl = document.getElementById("lm-count");
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    /* ページ内のロックアップと拡大表示は同じ案番号を共有する。
       どちらで送っても、開き直したときに番号がずれない。 */
    const stacks = [document.getElementById("lm-mark"),
                    document.getElementById("lm-spot-mark")];
    const srcOf = (n) => (MARKS[n] ? MARKS[n].src : "");
    let current = 1, lastFocus = null;

    /* 押した瞬間に描けるよう、全案を先に読み込んでデコードまで済ませておく。
       これをやらないと、切り替えの頭で1フレーム白が入る。 */
    for (let n = 1; n <= COUNT; n++) {
      const im = new Image();
      im.src = srcOf(n);
      if (im.decode) im.decode().catch(() => {});
    }

    for (const st of stacks) {
      st.querySelector("img").src = srcOf(1);
      st.querySelector("img").classList.add("is-front");
      st.dataset.front = "0";
    }
    countEl.textContent = pad(1) + " / " + pad(COUNT);

    let busy = false;
    /* --- クロスフェード ---
       裏の1枚に次の案を入れてから表に出す。デコード済みを待ってから
       動かす。待たないと絵の到着が遅れてフェードの途中でパッと現れる。 */
    const crossfade = (stack, src) => {
      const layers = stack.querySelectorAll("img");
      const out = layers[stack.dataset.front === "1" ? 1 : 0];
      const inc = out === layers[0] ? layers[1] : layers[0];
      inc.src = src;
      const run = () => {
        inc.classList.remove("is-out");
        out.classList.remove("is-front");
        out.classList.add("is-out");
        inc.classList.add("is-front");
        stack.dataset.front = inc === layers[1] ? "1" : "0";
      };
      (inc.decode ? inc.decode() : Promise.resolve()).then(run, run);
    };

    const show = (n) => {
      if (busy) return;
      current = ((n - 1 + COUNT) % COUNT) + 1;
      const label = "ロゴマーク案" + pad(current);
      const text = pad(current) + " / " + pad(COUNT);
      if (reduced) {
        for (const st of stacks) {
          st.querySelector("img.is-front").src = srcOf(current);
          st.setAttribute("aria-label", label);
        }
        countEl.textContent = text;
        return;
      }
      busy = true;
      for (const st of stacks) { crossfade(st, srcOf(current)); st.setAttribute("aria-label", label); }
      /* 数字は新しい案が出はじめる瞬間にそのまま差し替える。
         薄れさせて戻すと、小さい文字なので点滅にしか見えない。 */
      setTimeout(() => { countEl.textContent = text; }, 300);
      setTimeout(() => { busy = false; }, 700);
    };

    const openBtn = document.getElementById("lm-spotlight");
    const nextBtn = document.getElementById("lm-next");

    const open = () => {
      lastFocus = document.activeElement;
      spot.hidden = false;
      document.body.style.overflow = "hidden";
      /* rAF は非表示タブで止まるのでタイマーでも保険をかける
         (どちらが先に来ても class は1回しか付かない) */
      requestAnimationFrame(() => spot.classList.add("is-open"));
      setTimeout(() => spot.classList.add("is-open"), 60);
      nextBtn.focus({ preventScroll: true });
    };
    const close = () => {
      if (spot.hidden) return;
      spot.classList.remove("is-open");
      /* CSS の閉じ(白幕 0.55s)を待ってから消す。先に消すと途中で切れる */
      setTimeout(() => {
        spot.hidden = true;
        document.body.style.overflow = "";
        (lastFocus || openBtn).focus({ preventScroll: true });
      }, reduced ? 0 : 560);
    };

    openBtn.addEventListener("click", open);
    nextBtn.addEventListener("click", () => show(current + 1));
    /* 閉じるのは中身の外側クリックと ESC だけ */
    spot.addEventListener("click", (e) => {
      if (!e.target.closest(".lm-spot-inner")) close();
    });
    document.addEventListener("keydown", (e) => {
      if (spot.hidden) return;
      if (e.key === "Escape") close();
      if (e.key === "ArrowRight") show(current + 1);
      if (e.key === "ArrowLeft") show(current - 1);
    });
  })();
</script>
</body>
</html>
