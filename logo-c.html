<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Logomark C — props Branding Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/logo-detail.css" />
</head>
<body>
  <div class="wrap">
    <a class="ld-back" href="hub.html"><svg viewBox="0 0 14 12" width="11" height="9" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.8 6h11.2M8 1.4l4.6 4.6-4.6 4.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg> Back</a>
    <h1 class="ld-title">Logomark C <span class="thin">/ 重なる円</span></h1>

    <!-- ロックアップ: マーク + 既存のMiAIワードマーク -->
    <section class="ld-card">
      <p class="ld-card__label">Lockup</p>
      <div class="ld-lockup" style="--mark-h:96px; --gap-ratio:0.5">
        <img class="ld-lockup__mark" src="assets/logos/mark-c.svg" alt="ロゴマーク案C" />
        <img class="ld-lockup__word" src="assets/images/logo-miai.svg" alt="MiAI" />
      </div>
    </section>

    <!-- アイソレーション図解: js/logo-guide.js が data-* からSVGを組む -->
    <section class="ld-card">
      <p class="ld-card__label">Isolation / Clear space</p>
      <div class="lg-mount ld-guide-mount"
           data-mark-src="assets/logos/mark-c.svg"
           data-clear="0.5"></div>
      <p class="ld-note">
        X = ロゴマークの高さ。上下左右に 0.5X 以上のクリアスペースを確保し、
        この範囲には他の要素(文字・画像・罫線)を置かない。
        ※ クリアスペースの比率はまだ確定値ではなく、`data-clear` の1箇所で変更できる。
      </p>
    </section>

    <!-- 最小サイズ -->
    <section class="ld-card">
      <p class="ld-card__label">Minimum size</p>
      <div class="ld-min">
        <div class="ld-min__item">
          <span class="ld-min__art"><img src="assets/logos/mark-c.svg" alt="" style="height:24px" /></span>
          <span class="ld-min__meta">
            <span class="ld-min__val">24 px</span>
            <span class="ld-min__cap">デジタル最小(画面表示)</span>
          </span>
        </div>
        <div class="ld-min__item">
          <span class="ld-min__art"><img src="assets/logos/mark-c.svg" alt="" style="height:30px" /></span>
          <span class="ld-min__meta">
            <span class="ld-min__val">8 mm</span>
            <span class="ld-min__cap">印刷最小(高さ)</span>
          </span>
        </div>
      </div>
      <p class="ld-note">※ 最小サイズは参考実装に合わせた暫定値。実際の視認性確認後に確定する。</p>
    </section>
  </div>
  <script src="js/logo-guide.js"></script>
</body>
</html>
