<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>props - Branding Design / Implementation Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  :root {
    --ink: #111112;
    --ink-2: #6b6b70;
    --pane: #fafafa;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }
  body {
    background: #ffffff;
    font-family: "Noto Sans JP", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 128px 32px 160px;
  }

  /* --- 段階的な出現(タイトル → カード → 以降のセクション) --- */
  .stage {
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.8s var(--ease-out-expo) both;
  }
  .stage-1 { animation-delay: 0s; }
  .stage-2 { animation-delay: 0.09s; }
  .stage-3 { animation-delay: 0.18s; }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- タイトル --- */
  /* h1 が主役。他の要素はすべて小さく静かに。
     余白は3段階: 大96(チャンク間)/ 中56(ブロック間)/ 小8〜14 */
  h1 {
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 36px; /* Figma(1:4)実測。1行=36px */
    letter-spacing: 0.03em;
    margin-bottom: 96px;
  }
  h1 .thin { font-weight: 500; color: var(--ink-2); }

  /* --- 3案グリッド --- */
  /* A案のカラバリ3枚を、下の .logo-grid と同じ3列で左右いっぱいに並べる
     (325.33px × 3 + gap20 × 2 = 1016 = .wrap の内寸)。 */
  .carousel {
    display: grid;
    /* A案は2色。1fr×2 でグレーの囲みがラップ幅いっぱいまで伸びる */
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }
  /* カードは静止(浮遊・影なし。リンクのホバーのみ) */
  .card {
    display: flex;
    flex-direction: column;
    background: var(--pane);
    border-radius: 12px;
    padding: 44px 32px 40px;
    /* ABOUT US を外して1行になったぶん低くする。フォント読み込みで中身の
       高さが揺れてもセクション位置が波及しないよう、実測の自然高で固定
       (44 + 名前29 + 色名20 + 間42 + TOP27 + 40 = 202)。 */
    min-height: 202px;
  }
  .card .name {
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 14px; /* 小 */
  }
  /* 案名の右に添える色見本の●。色はカードごとに --dot で渡す */
  .card .name__dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--dot);
    /* 見た目の間隔はこの値 + 案名から続く字間(0.24em ≒ 2.6px)。
       詰めすぎないよう margin 側だけ 10 -> 6 にしている。 */
    margin-left: 6px;
    vertical-align: -1px;
  }
  .card .policy {
    /* 色名が欧字になったので、カード内の他の欧字(案名・TOP・カラーコード)と
       同じ Inter に揃える。日本語が入った場合の保険で Noto Sans JP を後置。 */
    font-family: "Inter", "Noto Sans JP", sans-serif;
    font-size: 13.5px;
    letter-spacing: 0.03em;
    margin-bottom: 42px; /* 中: 色名⇄TOP の分離(旧84の半分に詰めた) */
  }
  /* 色名の右のカラーコード。小さく淡く(参考実装の .cv-hex と同じ扱い) */
  .card .policy .hex {
    font-family: "Inter", sans-serif;
    font-weight: 500;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    color: var(--ink-2);
    margin-left: 4px;
  }
  /* 副リンク: 小さく淡く。主リンク群とは中余白で分離 */
  .concept-link {
    display: inline-flex;
    align-self: flex-start; /* flex列の中で伸びないよう=下線をテキスト幅に */
    align-items: center;
    font-family: "Inter", sans-serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ink);
    background: none;
    border: 0;
    padding: 2px 0;
    cursor: pointer;
    position: relative;
    margin-bottom: 56px; /* 中: 副⇄主リンク群の分離 */
    transition: color 0.6s var(--ease-out-expo);
  }
  .concept-link::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 100%;
    height: 1px;
    background: currentColor;
    opacity: 0.45; /* 常時は淡めの下線(リンクと分かる) */
    transform: scaleX(1);
    transform-origin: left;
    transition: transform 0.6s var(--ease-out-expo), opacity 0.6s var(--ease-out-expo);
  }
  .concept-link:hover { transition-duration: 0.35s; }
  .concept-link:hover::after { opacity: 0.9; transition-duration: 0.35s; }

  /* 主リンク: スミで明快。矢印とテキストは一体(gap 8・塊で動く) */
  .links { display: flex; flex-direction: column; gap: 10px; /* 小: 塊に見せる */ }
  .links a {
    position: relative;
    align-self: flex-start;
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-decoration: none;
    color: var(--ink);
    padding: 2px 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transform: translateX(0);
    transition: transform 0.6s var(--ease-out-expo); /* 戻り */
  }
  .links a .arrow { display: inline-flex; }
  .links a .arrow svg { display: block; }
  .links a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -2px;
    width: 100%;
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.6s var(--ease-out-expo); /* 戻り */
  }
  .links a:hover {
    transform: translateX(3px); /* テキスト+矢印が一体で右へ */
    transition-duration: 0.35s; /* 入り */
  }
  .links a:hover::after { transform: scaleX(1); transition-duration: 0.35s; }


  /* --- 以降のセクション(枠のみ・素材待ち) --- */
  .logos { margin-top: 96px; }
  /* セクション見出しは完全に同一ルールを共有:
     サイズ・太さ・字間・左位置・見出し→中身の余白 28px */
  .designs h2,
  .logos h2 {
    /* 日本語を含む見出しが将来入る想定で Noto Sans JP をフォールバックに置く。
       欧字は先頭のInterが当たるので字面は変わらない。 */
    font-family: "Inter", "Noto Sans JP", sans-serif;
    font-weight: 600;
    font-size: 12px;
    /* 未指定だと日本語を含む行だけ行高が18pxになり、セクションが3px高くなる */
    line-height: 15px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .logo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  /* Figma 246:26439。4案なので4列、パネルは正方(1016 - gap20×3 = 956 / 4 = 239)。 */
  .logo-grid--4 { grid-template-columns: repeat(4, 1fr); }
  .logo-grid .pane {
    display: block;
    position: relative;
    overflow: hidden;
    background: var(--pane);
    border-radius: 12px;
    height: 272px;
    text-decoration: none;
  }
  .logo-grid--4 .pane { height: auto; aspect-ratio: 1; }

  /* ロゴは幅だけ指定し、高さは画像の縦横比に任せる(案ごとに比率が違う)。
     幅はパネル239px基準の実測値を % で渡す(--mark-w)。
     セレクタを .logo-grid 起点にしているのは、上の
     `.logo-grid .pane { display: block }` に詳細度で勝つため。 */
  .logo-grid .pane-logo {
    display: grid;
    place-items: center;
  }
  .pane-logo img {
    display: block;
    width: var(--mark-w);
    height: auto;
    /* 待機時から微拡大しておき、ホバーでゆっくり寄る(参考実装と同じ挙動) */
    --mark-scale: 1;
    transform: scale(var(--mark-scale));
    transition: transform 0.5s cubic-bezier(0.47, 0.16, 0.24, 1);
  }
  @media (hover: hover) {
    .pane-logo:hover img { --mark-scale: 1.08; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pane-logo img { transition: none; }
    .pane-logo:hover img { --mark-scale: 1; }
  }


  /* --- Corporate Logomark: 1枚の横長パネル --- */
  .logo-grid--1 { grid-template-columns: 1fr; }
  .logo-grid--1 .pane { height: 272px; }
  .logo-grid .pane-mark {
    appearance: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    font: inherit;
  }
  .pane-mark img { width: 99px; }

  /* --- ロゴマーク案モーダル ---
     参考(proto-review-vict0a)と同じく「並べて見せるだけ」。
     枠線も押下も持たない。未確定の案はそのまま空欄にしておく。 */
  .modal.modal--wide .box { max-width: 1100px; padding: 48px 48px 44px; }
  .mk-panel {
    background: var(--pane);
    border-radius: 12px;
    padding: 56px 40px;
    margin-bottom: 20px;
  }
  .mk-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 40px 20px;
  }
  .mk {
    display: grid;
    place-items: center;
    aspect-ratio: 1;
  }
  .mk img { display: block; width: 56%; height: auto; }

  /* ロゴマーク & ロゴタイプのセット */
  .mk-set {
    background: var(--pane);
    border-radius: 12px;
    height: 220px;
    display: grid;
    place-items: center;
  }
  .mk-set__in { display: flex; align-items: center; gap: 40px; }
  .mk-set__mark { display: grid; place-items: center; width: 96px; height: 96px; }
  .mk-set__mark img { display: block; width: 78%; height: auto; }
  .mk-set__type { width: 300px; height: 60px; }

  @media (max-width: 860px) {
    .mk-grid { grid-template-columns: repeat(3, 1fr); }
    .modal.modal--wide .box { padding: 40px 24px 32px; }
    .mk-set__in { flex-direction: column; gap: 20px; }
    .mk-set { height: auto; padding: 32px 0; }
  }

  /* --- Design concept モーダル --- */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 32px;
    visibility: hidden;
  }
  .modal.is-open { visibility: visible; }
  .modal .overlay {
    position: absolute;
    inset: 0;
    background: rgba(17, 17, 18, 0.28);
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  .modal.is-open .overlay { opacity: 1; }
  .modal .box {
    position: relative;
    background: #fff;
    border-radius: 14px;
    max-width: 560px;
    width: 100%;
    /* 3段落のコンセプト文(=現状の最長)が900px高の画面でスクロールなしに
       収まる高さ。これを超える長文が入った場合だけ内部スクロールに落ちる。 */
    max-height: min(84vh, 680px);
    overflow: auto;
    padding: 56px 56px 52px;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.5s var(--ease-out-expo), transform 0.5s var(--ease-out-expo);
  }
  .modal.is-open .box { opacity: 1; transform: translateY(0); }
  .modal .m-name {
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 10px;
  }
  .modal .m-policy {
    font-size: 12.5px;
    letter-spacing: 0.04em;
    color: var(--ink-2);
    margin-bottom: 32px;
  }
  .modal h3 {
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 0.06em;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .modal .m-body p {
    font-size: 14px;
    letter-spacing: 0.04em;
    line-height: 2.1;
  }
  .modal .m-body p + p { margin-top: 16.8px; }
  .modal .close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    background: none;
    border: 0;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--ink);
  }
  .modal .close svg { width: 14px; height: 14px; }
  .modal .close:hover { opacity: 0.55; }
  body.modal-open { overflow: hidden; }

  @media (max-width: 900px) {
    /* 3列/4列が収まらない幅は、どちらのグリッドも2列に落とす */
    .carousel,
    .logo-grid,
    .logo-grid--4 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 760px) {
    .wrap { padding: 88px 24px 112px; }
    .carousel { grid-template-columns: 1fr; } /* 狭幅は縦積み(はみ出し防止) */
    h1 {
      font-size: 24px;
      line-height: 1.35;
      margin-bottom: 64px;
    }
    .modal .box { padding: 44px 32px 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage { animation: none; opacity: 1; transform: none; }
    .links a, .links a::after, .concept-link, .concept-link::after { transition: none; }
    .links a:hover { transform: none; }
    .modal .overlay, .modal .box { transition: none; }
    .modal.is-open .box { opacity: 1; transform: none; }
  }

</style>
</head>
<body>
  <div class="wrap">
    <header class="stage stage-1">
      <h1>props - Branding Design <span class="thin">/ Implementation Prototype</span></h1>
    </header>

    <!-- ============ Corporate Website Design(A案 / B案) ============ -->
    <section class="designs stage stage-2" aria-label="Corporate Website Design">
      <h2>Corporate Website Design</h2>
      <!-- A案のカラーバリエーション2枚(参考: proto-review の C-1〜C-4 比較UI)。
           名前の右の●が各案の色。2枚とも専用ページへ遷移する。
           カードは 2 列いっぱいに伸ばし、ラップのマージン内で完結させる。 -->
      <div class="carousel">

        <section class="card">
          <p class="name">Design A-1<span class="name__dot" style="--dot:#FF2400" aria-hidden="true"></span></p>
          <p class="policy">Red-orange <span class="hex">#FF2400</span></p>
          <div class="links">
            <a href="Red-orange.html">TOP <span class="arrow" aria-hidden="true"><svg viewBox="0 0 14 12" width="11" height="9" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.8 6h11.2M8 1.4l4.6 4.6-4.6 4.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
          </div>
        </section>

        <section class="card">
          <p class="name">Design A-2<span class="name__dot" style="--dot:#0D0D0D" aria-hidden="true"></span></p>
          <p class="policy">Dark black <span class="hex">#0D0D0D</span></p>
          <div class="links">
            <a href="darkblack.html">TOP <span class="arrow" aria-hidden="true"><svg viewBox="0 0 14 12" width="11" height="9" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.8 6h11.2M8 1.4l4.6 4.6-4.6 4.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
          </div>
        </section>

      </div>
    </section>

    <!-- ============ Corporate Logomark & Logotype ============
         Figma 246:26437。4案を正方パネル(239px)×4列で並べる。
         各パネルはアイソレーション図解のページへ遷移する。 -->
    <section class="logos stage stage-3" aria-label="Corporate Logomark &amp; Logotype">
      <h2>Corporate Logomark &amp; Logotype</h2>
      <div class="logo-grid logo-grid--4">
        <a class="pane pane-logo" href="logo-a.html">
          <img src="assets/logos/mark-a.svg" alt="ロゴマーク案A" width="99" height="99" style="--mark-w: 41.00%">
        </a>
        <a class="pane pane-logo" href="logo-b.html">
          <img src="assets/logos/mark-b.svg" alt="ロゴマーク案B" width="88" height="88" style="--mark-w: 36.82%">
        </a>
        <a class="pane pane-logo" href="logo-c.html">
          <img src="assets/logos/mark-c.svg" alt="ロゴマーク案C" width="141" height="86" style="--mark-w: 57.74%">
        </a>
        <a class="pane pane-logo" href="logo-d.html">
          <img src="assets/logos/mark-d.svg" alt="ロゴマーク案D" width="155" height="102" style="--mark-w: 82.01%">
        </a>
      </div>
    </section>

    <!-- ============ Corporate Logomark ============
         ロゴマーク単体の案出し。押すと 10 案とロゴマーク & ロゴタイプの
         セットを見比べるモーダルが開く。中身のロゴは未確定なので、
         いまは箱(スロット)だけを置いている。左上だけ DESIGN A のマーク。 -->
    <section class="logos stage stage-3" aria-label="Corporate Logomark">
      <h2>Corporate Logomark</h2>
      <div class="logo-grid logo-grid--1">
        <button class="pane pane-logo pane-mark" type="button" id="open-marks"
                aria-haspopup="dialog" aria-label="ロゴマーク案を見る">
          <img src="assets/logos/mark-a.svg" alt="" width="99" height="99">
        </button>
      </div>
    </section>

  </div>


  <!-- ============ ロゴマーク案モーダル ============
       参考(proto-review-vict0a)と同じ見せ方。5 列 x 2 行に案を並べ、
       その下にロゴマーク & ロゴタイプのセットを置く。
       いま中身があるのは左上(DESIGN A)だけで、残りは空欄。
       案が決まり次第 MARKS に足していけば枠が埋まる。 -->
  <div class="modal modal--wide" id="marks-modal" role="dialog" aria-modal="true"
       aria-labelledby="marks-title" hidden>
    <div class="overlay" data-close></div>
    <div class="box">
      <button class="close" type="button" data-close aria-label="閉じる">
        <svg viewBox="0 0 14 14" fill="none"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <p class="m-name" id="marks-title">Corporate Logomark</p>
      <div class="mk-panel">
        <div class="mk-grid" id="mk-grid"></div>
      </div>
      <div class="mk-set">
        <div class="mk-set__in">
          <div class="mk-set__mark" id="mk-set-mark"></div>
          <div class="mk-set__type" id="mk-set-type"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ Design concept モーダル ============ -->
  <div class="modal" id="concept-modal" role="dialog" aria-modal="true" aria-labelledby="concept-title" hidden>
    <div class="overlay" data-close></div>
    <div class="box">
      <button class="close" type="button" data-close aria-label="閉じる">
        <svg viewBox="0 0 14 14" fill="none"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <p class="m-name" id="concept-name"></p>
      <p class="m-policy" id="concept-policy"></p>
      <h3 id="concept-title"></h3>
      <div class="m-body" id="concept-body"></div>
    </div>
  </div>

  <script>
  (() => {
    "use strict";

    /* ================================================
       コンセプト文(※ドラフト・差し替え可)
       2案ぶんをこの1箇所にまとめて記述。
       body は配列1要素 = 1段落。
    ================================================ */
    const CONCEPTS = {
      a: {
        name: "Design A",
        policy: "ウォームグラデーション × ラウンド",
        title: "AIシフトを、あたたかい光として。",
        body: [
          "産業のAIシフトという、多くの企業にとってまだ輪郭のはっきりしないテーマ。それを冷たい技術ではなく、人に寄り添う光として描きました。白をベースに、コーポレートカラーのオレンジ(#FF2400)から淡いコーラルへ溶けるグラデーションを大きく置いています。",
          "角を落としたカード、ゆるやかな円——形はすべて丸みを基調にしました。「企業と人のコミュニケーション」を支える会社として、鋭さよりも受け止める柔らかさを優先しています。事業内容のセクションだけを濃色へ反転させ、プロダクトの存在感を一点で際立たせました。",
          "立ち上がりは、白いカーテンが円状に開いて本文が現れる演出。ロゴは粒子が集まって形になるアニメーションで、「人の力を最大化する」という思想を動きで語ります。",
        ],
      },
      b: {
        name: "Design B",
        policy: "モノクローム × フォトグラフィック",
        title: "語るのは、写真と余白。",
        body: [
          "装飾を削ぎ落とし、白・黒・グレーだけで構成したエディトリアルな設計です。色で印象づける代わりに、写真と余白、タイポグラフィの強弱で伝えます。AIという抽象的な技術を扱うからこそ、そこに写る「人」と「現場」を主役に据えました。",
          "画面を大きく使った写真、黒へ反転する事業内容セクション、罫線で整理された会社概要。要素ごとに面のコントラストを切り替えることで、スクロールに一定のリズムが生まれます。派手な動きに頼らず、構造そのものでページを読ませる構成です。",
          "落ち着いたトーンは、BtoBの意思決定者に向けた誠実さの表明でもあります。技術と実績を、静かに、過不足なく提示する——そういう佇まいを目指しました。",
        ],
      },
    };

    const modal = document.getElementById("concept-modal");
    const nameEl = document.getElementById("concept-name");
    const policyEl = document.getElementById("concept-policy");
    const titleEl = document.getElementById("concept-title");
    const bodyEl = document.getElementById("concept-body");
    let lastFocus = null;

    const open = (key) => {
      const c = CONCEPTS[key];
      if (!c) return;
      nameEl.textContent = c.name;
      policyEl.textContent = c.policy;
      titleEl.textContent = c.title;
      bodyEl.innerHTML = "";
      c.body.forEach((t) => {
        const p = document.createElement("p");
        p.textContent = t;
        bodyEl.appendChild(p);
      });
      lastFocus = document.activeElement;
      modal.hidden = false;
      requestAnimationFrame(() => modal.classList.add("is-open"));
      /* rAFが凍結する環境向けの保険 */
      setTimeout(() => modal.classList.add("is-open"), 60);
      document.body.classList.add("modal-open");
      modal.querySelector(".close").focus();
    };

    const close = () => {
      modal.classList.remove("is-open");
      document.body.classList.remove("modal-open");
      const done = () => { modal.hidden = true; };
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduced) done(); else setTimeout(done, 480);
      if (lastFocus) lastFocus.focus();
    };

    document.querySelectorAll(".concept-link").forEach((b) =>
      b.addEventListener("click", () => open(b.dataset.concept))
    );
    modal.querySelectorAll("[data-close]").forEach((el) =>
      el.addEventListener("click", close)
    );
    document.addEventListener("keydown", (e) => {
      if (modal.hidden) return;
      if (e.key === "Escape") close();
      /* フォーカストラップ: モーダル内のフォーカス可能要素で循環 */
      if (e.key === "Tab") {
        const f = [...modal.querySelectorAll("button, a, [tabindex]")].filter(
          (el) => !el.disabled && el.offsetParent !== null
        );
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault(); last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault(); first.focus();
        }
      }
    });
  })();
  
  /* ---- ロゴマーク案モーダル ----
     並べて見せるだけ。枠の押下は持たない(指示)。
     案が決まったら MARKS に足すと、その枠に入る。 */
  (() => {
    "use strict";
    const COUNT = 10;
    const MARKS = { 1: "assets/logos/mark-a.svg" };   /* 決まった案から順に足す */

    const modal = document.getElementById("marks-modal");
    if (!modal) return;
    const grid = document.getElementById("mk-grid");
    const setMark = document.getElementById("mk-set-mark");
    const opener = document.getElementById("open-marks");
    let lastFocus = null;

    const art = (src) => { const i = document.createElement("img"); i.src = src; i.alt = ""; return i; };

    for (let i = 1; i <= COUNT; i++) {
      const cell = document.createElement("div");
      cell.className = "mk";
      if (MARKS[i]) cell.appendChild(art(MARKS[i]));
      grid.appendChild(cell);
    }
    /* セットには確定している案(左上)のマークを置く。ロゴタイプは未確定 */
    if (MARKS[1]) setMark.appendChild(art(MARKS[1]));

    const open = () => {
      lastFocus = document.activeElement;
      modal.hidden = false;
      requestAnimationFrame(() => modal.classList.add("is-open"));
      setTimeout(() => modal.classList.add("is-open"), 60);
      document.body.classList.add("modal-open");
      modal.querySelector(".close").focus();
    };
    const close = () => {
      modal.classList.remove("is-open");
      document.body.classList.remove("modal-open");
      const done = () => { modal.hidden = true; };
      matchMedia("(prefers-reduced-motion: reduce)").matches ? done() : setTimeout(done, 480);
      if (lastFocus) lastFocus.focus();
    };
    if (opener) opener.addEventListener("click", open);
    modal.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", close));
    document.addEventListener("keydown", (e) => {
      if (modal.hidden) return;
      if (e.key === "Escape") close();
    });
  })();
  </script>
</body>
</html>
